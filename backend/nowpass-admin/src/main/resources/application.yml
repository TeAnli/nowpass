server:
  # 18090：8080/8090 均被本机其它项目间歇性占用，用少见端口降低冲突概率
  port: 18090
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: nowpass
  datasource:
    # 5434：docker-compose 里的 postgres 映射到宿主机 5434
    # （5432 是本机 PostgreSQL 18，5433 是另一个项目的容器）
    url: jdbc:postgresql://127.0.0.1:5434/nowpass
    username: nowpass
    password: nowpass123
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3s
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
          connectiontimeout: 3000
          timeout: 3000
          writetimeout: 3000
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai

nowpass:
  token:
    # token 有效期（分钟），滑动续期阈值（分钟）
    expire-minutes: 120
    refresh-threshold-minutes: 60
  mail:
    enabled: true
    from: "NowPass <no-reply@nowpass.local>"
  register:
    # 注册后是否需要管理员审批才能激活
    require-approval: true
  login:
    # 同一账号连续失败多少次后锁定，以及锁定时长（分钟）
    max-retry: 5
    lock-minutes: 15
  init:
    # 启动时若不存在该账号则创建超级管理员
    admin-username: admin
    admin-password: Admin@123456
  interview:
    enabled: true
    base-url: ${INTERVIEW_BASE_URL:https://api.openai.com/v1}
    api-key: ${INTERVIEW_API_KEY:}
    model: ${INTERVIEW_MODEL:gpt-4o-mini}
    temperature: 0.6
    max-history: 20
  tts:
    enabled: ${TTS_ENABLED:false}
    access-key-id: ${ALIYUN_TTS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_TTS_ACCESS_KEY_SECRET:}
    app-key: ${ALIYUN_TTS_APP_KEY:}
    region: ${ALIYUN_TTS_REGION:cn-shanghai}
    voice: ${ALIYUN_TTS_VOICE:zhixiaoxia}
    format: mp3
    sample-rate: 16000
    speech-rate: 0
    pitch-rate: 0
    volume: 50
    max-chars: 300
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://127.0.0.1:9002}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:nowpass-media}
    upload-url-minutes: 15
    playback-url-minutes: 120
    max-video-bytes: 524288000
    max-cover-bytes: 5242880
  qq:
    enabled: ${QQ_OAUTH_ENABLED:false}
    app-id: ${QQ_APP_ID:}
    app-key: ${QQ_APP_KEY:}
    redirect-uri: ${QQ_REDIRECT_URI:http://127.0.0.1:8088/api/auth/qq/callback}
    frontend-redirect-uri: ${QQ_FRONTEND_REDIRECT_URI:http://127.0.0.1:8088/oauth/qq/callback}
    state-minutes: 5
    ticket-minutes: 2

logging:
  level:
    root: info
    com.nowpass: debug
    org.jetbrains.exposed: info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
