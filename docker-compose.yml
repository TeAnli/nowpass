name: nowpass

services:
  postgres:
    image: postgres:16
    container_name: nowpass-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nowpass
      POSTGRES_USER: nowpass
      POSTGRES_PASSWORD: nowpass123
      TZ: Asia/Shanghai
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # 宿主机 5434 -> 容器 5432（5432 是本机 PostgreSQL 18，5433 是另一个项目的容器）
      - "5434:5432"
    volumes:
      - nowpass-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nowpass -d nowpass"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: nowpass-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - nowpass-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 开发期邮件收件箱：http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: nowpass-mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "1025:1025"
      - "8025:8025"

  # ---------- 全栈容器化：docker compose --profile app up -d --build ----------
  backend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    image: nowpass-backend:local
    container_name: nowpass-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      TZ: Asia/Shanghai
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nowpass
      SPRING_DATASOURCE_USERNAME: nowpass
      SPRING_DATASOURCE_PASSWORD: nowpass123
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
      NOWPASS_MAIL_ENABLED: "true"
    ports:
      - "18090:18090"

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: nowpass-frontend:local
    container_name: nowpass-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8088:80"

volumes:
  nowpass-pgdata:
  nowpass-redisdata:
